name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Unpack source zip if present
        run: |
          if [ -f CallVault-source.zip ]; then
            unzip -q -o CallVault-source.zip -d src
            echo "APP_DIR=src/callvault" >> "$GITHUB_ENV"
          else
            echo "APP_DIR=." >> "$GITHUB_ENV"
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK licenses
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: ${{ env.APP_DIR }}
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp "$APP_DIR/app/build/outputs/apk/debug/app-debug.apk" CallVault.apk

      - uses: actions/upload-artifact@v4
        with:
          name: CallVault
          path: CallVault.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v1.0.${{ github.run_number }}" CallVault.apk \
            --title "CallVault 1.0.${{ github.run_number }}" \
            --notes "Automatic build from ${{ github.sha }}" \
            --latest
